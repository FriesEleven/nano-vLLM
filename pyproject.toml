# 声明构建本 Python 包所需的工具配置段。
[build-system]
# 指定构建时至少需要的 setuptools 版本。
requires = ["setuptools>=61"]
# 指定由 setuptools 提供的标准 PEP 517 构建后端。
build-backend = "setuptools.build_meta"

# 声明发布到 Python 包索引时使用的项目元数据。
[project]
# 指定安装后使用的包名称。
name = "nano-vllm"
# 指定当前发行版本号。
version = "0.2.0"
# 记录项目作者元数据。
authors = [{ name = "Xingkai Yu" }]
# 声明项目采用 MIT 许可证。
license = "MIT"
# 指定随发行包一起包含的许可证文件。
license-files = ["LICENSE"]
# 指定 PyPI 页面使用的项目说明文件。
readme = "README.md"
# 提供简短的项目用途描述。
description = "a lightweight vLLM implementation built from scratch"
# 限定受支持的 Python 解释器版本范围。
requires-python = ">=3.10,<3.13"
# 开始声明运行时需要安装的第三方依赖列表。
dependencies = [
    # PyTorch 提供张量计算、模型模块和 CUDA 运行时接口。
    "torch>=2.4.0",
    # Triton 用于编写高性能 KV Cache 写入 kernel。
    "triton>=3.0.0",
    # Transformers 用于读取 Hugging Face 配置和 tokenizer。
    "transformers>=4.51.0",
    # FlashAttention 提供变长 prefill 与带 KV Cache 的 attention 实现。
    "flash-attn",
    # xxhash 用于快速计算前缀缓存的块哈希。
    "xxhash",
]

# 声明项目相关链接的元数据段。
[project.urls]
# 指向项目上游主页。
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

# 配置 setuptools 自动发现可发布的 Python 包。
[tool.setuptools.packages.find]
# 从仓库根目录开始查找包目录。
where = ["."]
# 仅将 nanovllm 及其子包纳入发行物。
include = ["nanovllm*"]
